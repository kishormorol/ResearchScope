name: Idea or feature request
description: Suggest something this project should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve
      description: Describe the situation you are in when you need this, not just the feature.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
  - type: checkboxes
    id: help
    attributes:
      label: Would you like to work on it?
      options:
        - label: I would be up for opening a PR for this
