name: Conference Backfill

# One-time (or on-demand) deep sync of all historical conference papers.
# Fetches everything: PMLR (ICML, AISTATS, UAI), OpenReview (ICLR, NeurIPS,
# COLM), CVF (CVPR, ICCV, ECCV), ACL Anthology, and S2 bulk
# (AAAI, IJCAI, KDD, WWW, SIGIR, WSDM, CHI, SIGMOD, ICSE).
# Takes ~30-60 min.  Run manually after adding new venue years.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — fetch and count papers without committing'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

concurrency:
  group: push-to-main
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Require main branch
        shell: bash
        run: |
          if [ "${GITHUB_REF:-}" != "refs/heads/main" ]; then
            echo "::error::Run this publishing workflow from main."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Full conference backfill
        env:
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENREVIEW_EMAIL: ${{ secrets.OPENREVIEW_EMAIL }}
          OPENREVIEW_PASSWORD: ${{ secrets.OPENREVIEW_PASSWORD }}
          RAILWAY_DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "Running full conference backfill..."
          python src/pipeline.py --conferences-only --max-results 1000

      - name: Report results
        run: |
          python -c "
          import json, os
          from collections import Counter
          cdb_path = 'site/data/conferences_db.json'
          if os.path.exists(cdb_path):
              cdb = json.load(open(cdb_path, encoding='utf-8'))
              venues = Counter(p.get('venue','unknown') for p in cdb)
              print(f'Total conference papers in JSON: {len(cdb)}')
              for v, n in sorted(venues.items(), key=lambda x: -x[1]):
                  print(f'  {v}: {n}')
          else:
              print('conferences_db.json not found')
          "

      - name: Build conference recommender data
        run: python src/sitegen/conference_recommender.py

      - name: Commit updated data
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data/
          if [ -d data ]; then
            git add data/
          fi
          bash scripts/publish_generated_data.sh "chore: conference backfill [$(date -u +%Y-%m-%d)]"

      - name: Upload generated data recovery
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: conference-backfill-generated-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-recovery/
          retention-days: 14
          if-no-files-found: ignore

  deploy:
    needs: backfill
    if: github.repository == 'kishormorol/ResearchScope' && github.event.inputs.dry_run != 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
