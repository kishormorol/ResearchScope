name: Daily arXiv Pipeline

on:
  schedule:
    # Run daily at 06:00 UTC — after arXiv's nightly announcement (~05:00 UTC)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      today_mode:
        description: 'Fetch ALL CS papers published today on arXiv (true/false)'
        required: false
        default: 'true'
      today_max:
        description: 'Max papers in today-mode (default 2000)'
        required: false
        default: '2000'
      skip_acl:
        description: 'Skip ACL Anthology fetch (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  pipeline:
    if: github.repository == 'kishormorol/ResearchScope' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        shell: bash
        run: |
          if [ "${GITHUB_REF:-}" != "refs/heads/main" ]; then
            echo "::error::Run this publishing workflow from main."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Run arXiv + ACL pipeline
        env:
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RAILWAY_DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          TODAY_MODE="${{ github.event.inputs.today_mode || 'true' }}"
          TODAY_MAX="${{ github.event.inputs.today_max || '2000' }}"
          SKIP_ACL="${{ github.event.inputs.skip_acl || 'false' }}"

          FLAGS="--skip-conferences"   # conferences are synced separately (monthly)
          if [ "$TODAY_MODE" = "true" ]; then
            FLAGS="$FLAGS --today --today-max $TODAY_MAX"
          fi
          if [ "$SKIP_ACL" = "true" ]; then
            FLAGS="$FLAGS --skip-acl"
          fi

          echo "Running: python src/pipeline.py $FLAGS"
          python src/pipeline.py $FLAGS

      - name: Verify output
        run: |
          python -c "
          import json, os
          papers = json.load(open('site/data/papers.json'))
          arxiv  = [p for p in papers if p.get('venue') in (None,'','arXiv','Unknown')]
          conf   = [p for p in papers if p.get('venue') not in (None,'','arXiv','Unknown')]
          print(f'papers.json: {len(arxiv)} arXiv + {len(conf)} conference = {len(papers)} total')
          db = json.load(open('site/data/papers_db.json'))
          print(f'papers_db.json: {len(db)} arXiv papers')
          conf_db_path = 'site/data/conferences_db.json'
          if os.path.exists(conf_db_path):
              cdb = json.load(open(conf_db_path))
              print(f'conferences_db.json: {len(cdb)} conference papers')
          else:
              print('conferences_db.json: not present yet (run conference-sync to populate)')
          "

      - name: Commit updated data
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data/
          bash scripts/publish_generated_data.sh "chore: daily arXiv update [$(date -u +%Y-%m-%d)]"

      - name: Upload generated data recovery
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-generated-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-recovery/
          retention-days: 14
          if-no-files-found: ignore

  deploy:
    needs: pipeline
    if: github.repository == 'kishormorol/ResearchScope'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

  # Per-section fine-tuning dataset for A* papers. Runs in parallel — does not
  # block the data refresh or Pages deploy. Uses the committed conferences_db.json
  # (untouched by the --skip-conferences pipeline job), so no dependency needed.
  build-sections:
    name: Build section fine-tuning dataset
    if: github.repository == 'kishormorol/ResearchScope'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 330   # under the 6h job cap even with GROBID restarts
    services:
      grobid:
        # CRF (lightweight) on a modern JDK — the 0.8.0 image NPEs on cgroup v2.
        image: lfoppiano/grobid:0.9.0-crf
        ports:
          - 8070:8070
    steps:
      - name: Require main branch
        shell: bash
        run: |
          if [ "${GITHUB_REF:-}" != "refs/heads/main" ]; then
            echo "::error::Run this publishing workflow from main."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Wait for GROBID
        run: |
          for i in $(seq 1 60); do
            if curl -sf -m 3 http://localhost:8070/api/isalive | grep -qi true; then
              echo "GROBID is alive"; exit 0
            fi
            echo "waiting for GROBID… ($i)"; sleep 5
          done
          echo "GROBID did not become ready"; exit 1

      - name: Build section dataset
        env:
          PYTHONPATH: ${{ github.workspace }}
          GROBID_URL: http://localhost:8070
        run: |
          python scripts/build_sections.py \
            --limit 2000 --min-citations 0 --max-pdf-mb 10 --delay 0.3 \
            --out data/sections.jsonl

      - name: Push sections split to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # push_sections() no-ops if HF_TOKEN is unset or the file is empty.
          python -c "from src.storage.hf_dataset import push_sections; push_sections('data/sections.jsonl')"

      - name: Upload dataset artifact
        uses: actions/upload-artifact@v7
        with:
          name: sections-jsonl
          path: data/sections.jsonl
          retention-days: 14
          if-no-files-found: warn
