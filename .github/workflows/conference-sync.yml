name: Monthly Conference Sync

# Conferences publish once a year — syncing monthly is more than enough.
# Papers accumulate in papers_db.json and persist across daily arXiv runs.

on:
  schedule:
    - cron: '0 8 1 * *'   # 1st of every month at 08:00 UTC
  workflow_dispatch:
    inputs:
      max_results:
        description: 'Max papers per S2 keyword query (fallback only). Bulk S2 and OpenReview/PMLR/CVF/ACL always fetch ALL papers.'
        required: false
        default: '500'

permissions:
  contents: write

concurrency:
  group: push-to-main
  cancel-in-progress: false

jobs:
  conference-sync:
    if: github.repository == 'kishormorol/ResearchScope' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        shell: bash
        run: |
          if [ "${GITHUB_REF:-}" != "refs/heads/main" ]; then
            echo "::error::Run this publishing workflow from main."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Sync conference papers (OpenReview + PMLR + CVF + ACL + S2 bulk)
        env:
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENREVIEW_EMAIL: ${{ secrets.OPENREVIEW_EMAIL }}
          OPENREVIEW_PASSWORD: ${{ secrets.OPENREVIEW_PASSWORD }}
          RAILWAY_DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          MAX="${{ github.event.inputs.max_results || '500' }}"
          echo "Running: python src/pipeline.py --conferences-only --max-results $MAX"
          echo "Sources: OpenReview (ICLR 2022-25, NeurIPS 2022-24, COLM)"
          echo "         PMLR (ICML 2020-25, AISTATS 2021-25, UAI 2021-24)"
          echo "         CVF  (CVPR 2021-25, ICCV 2021+23, ECCV 2020+22+24)"
          echo "         ACL  (2020+)"
          echo "         S2   (AAAI, IJCAI, KDD, WWW, SIGIR, WSDM, CHI, SIGMOD, ICSE)"
          python src/pipeline.py --conferences-only --max-results $MAX

      - name: Report results
        run: |
          python -c "
          import json, os
          cdb = json.load(open('site/data/conferences_db.json'))
          venues = {}
          for p in cdb:
            v = p.get('venue', 'unknown')
            venues[v] = venues.get(v, 0) + 1
          print(f'Conference papers in conferences_db.json: {len(cdb)}')
          for v, n in sorted(venues.items(), key=lambda x: -x[1]):
            print(f'  {v}: {n}')
          arxiv_path = 'site/data/papers_db.json'
          if os.path.exists(arxiv_path):
            arxiv_db = json.load(open(arxiv_path))
            print(f'arXiv papers in papers_db.json: {len(arxiv_db)}')
          else:
            print('papers_db.json not found; continuing with conference-only update')
          "

      - name: Build conference recommender data
        run: |
          python src/sitegen/conference_recommender.py

      - name: Build journal recommender data
        run: |
          python src/sitegen/journal_recommender.py

      - name: Commit updated data
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data/
          bash scripts/publish_generated_data.sh "chore: monthly conference sync [$(date -u +%Y-%m)]"

      - name: Upload generated data recovery
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: conference-sync-generated-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-recovery/
          retention-days: 14
          if-no-files-found: ignore

  deploy:
    needs: conference-sync
    if: github.repository == 'kishormorol/ResearchScope'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
