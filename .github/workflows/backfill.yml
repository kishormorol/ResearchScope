name: Backfill Historical Papers

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: 'Start date (YYYY-MM-DD) — e.g. 2026-01-01'
        required: true
        default: '2026-01-01'
      skip_conferences:
        description: 'Skip conference connectors (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: push-to-main
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Require main branch
        shell: bash
        run: |
          if [ "${GITHUB_REF:-}" != "refs/heads/main" ]; then
            echo "::error::Run this publishing workflow from main."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backfill pipeline
        run: |
          SKIP_FLAG=""
          if [ "${{ github.event.inputs.skip_conferences }}" = "true" ]; then
            SKIP_FLAG="--skip-conferences"
          fi
          python src/pipeline.py --backfill-from "${{ github.event.inputs.from_date }}" $SKIP_FLAG
        env:
          PYTHONPATH: ${{ github.workspace }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}

      - name: Commit backfilled data
        env:
          FROM_DATE: ${{ inputs.from_date }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add site/data/
          bash scripts/publish_generated_data.sh "chore: backfill data from $FROM_DATE"

      - name: Upload generated data recovery
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backfill-generated-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-recovery/
          retention-days: 14
          if-no-files-found: ignore

  deploy:
    needs: backfill
    if: github.repository == 'kishormorol/ResearchScope'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
