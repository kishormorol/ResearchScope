name: Register sections config in HF card

# Maintenance: ensure the dataset card declares the `sections` config so
# load_dataset(..., "sections") resolves. push_sections() now does this on every
# run; this manual workflow patches an already-uploaded file's card without a
# full rebuild.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  register:
    name: Register sections config
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        shell: bash
        run: |
          if [ "${GITHUB_REF:-}" != "refs/heads/main" ]; then
            echo "::error::Run this publishing workflow from main."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Register sections config in card
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "import os; from huggingface_hub import HfApi; from src.storage.hf_dataset import _ensure_sections_config; _ensure_sections_config(HfApi(token=os.environ['HF_TOKEN']))"
