name: Update Data & Deploy Pages

on:
  schedule:
    - cron: "0 2 * * 1-5"   # weekdays only (Mon–Fri) at 02:00 UTC
  workflow_dispatch:        # manual trigger

permissions:
  contents: write

concurrency:
  group: push-to-main
  cancel-in-progress: false

jobs:
  update-data:
    name: Fetch & Process Research Data
    if: github.repository == 'kishormorol/ResearchScope' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: |
          python src/pipeline.py --today
        env:
          PYTHONPATH: ${{ github.workspace }}
          RAILWAY_DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Build conference recommender data
        run: |
          python src/sitegen/conference_recommender.py

      - name: Check for data changes
        id: check
        run: |
          git add data/ site/data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated data
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update research data [$(date -u +%Y-%m-%d)]"
          git pull --rebase --autostash origin main
          git push

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: update-data
    if: github.repository == 'kishormorol/ResearchScope'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    secrets:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
